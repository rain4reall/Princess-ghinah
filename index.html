<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Princess Ghina ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #26001f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      width: 90%;
      max-width: 350px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
    }

    button {
      margin-top: 15px;
      padding: 14px 30px;
      border: 0;
      border-radius: 12px;
      font-size: 18px;
    }

    #result {
      display: none;
      margin-top: 30px;
    }

    img {
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      display: block;
      margin: 0 auto 25px;
    }

    audio {
      width: 100%;
      max-width: 450px;
    }
  </style>
</head>

<body>

  <h1>إلى الأميرة غنى ❤️</h1>

  <div id="login">

    <input
      id="password"
      type="password"
      placeholder="كلمة السر"
    >

    <br>

    <button onclick="enter()">
      دخول ❤️
    </button>

  </div>

  <div id="result">

    <h2>❤️</h2>

    <img
      src="./PHOTO-2026-09-19-20-44-07.jpg"
      alt="Ghina"
    >

    <audio controls preload="metadata">
      <source
        src="https://rain4reall.github.io/Princess-ghinah/song.mp3"
        type="audio/mpeg"
      >
      متصفحك لا يدعم تشغيل الصوت.
    </audio>

  </div>

  <script>
    function enter() {

      if (document.getElementById("password").value === "princess") {

        document.getElementById("login").style.display = "none";

        document.getElementById("result").style.display = "block";

      } else {

        alert("كلمة السر غير صحيحة ❤️");

      }
    }
  </script>

</body>

</html>
