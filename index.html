<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Princess Ghina ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a001f, #6b1d58, #160014);
      color: white;
    }

    .box {
      width: 90%;
      max-width: 450px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      text-align: center;
      margin-bottom: 15px;
    }

    button {
      padding: 14px 35px;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      color: #ffb6d9;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>إلى الأميرة غنى ❤️</h1>

    <input
      type="password"
      id="password"
      placeholder="اكتبي كلمة السر"
    >

    <button onclick="checkPassword()">
      دخول ❤️
    </button>

    <div id="message"></div>

  </div>

  <script>
    function checkPassword() {

      const password = document.getElementById("password").value;

      if (password === "princess") {
        document.getElementById("message").innerHTML =
          "تم الدخول بنجاح ❤️";
      } else {
        document.getElementById("message").innerHTML =
          "كلمة السر غير صحيحة ❤️";
      }

    }
  </script>

</body>
</html>
