<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Princess Ghina ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #26001f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      width: 90%;
      max-width: 350px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      text-align: center;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 14px 30px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    #result {
      display: none;
      margin-top: 30px;
    }

    img {
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      display: block;
      margin: 0 auto 25px;
    }

    audio {
      width: 100%;
      max-width: 450px;
      margin-bottom: 25px;
    }

    #letter {
      max-width: 600px;
      margin: 20px auto;
      font-size: 20px;
      line-height: 2;
      text-align: right;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h1>إلى الأميرة غنى ❤️</h1>

  <div id="login">

    <input
      id="password"
      type="password"
      placeholder="كلمة السر"
    >

    <br>

    <button onclick="enter()">
      دخول ❤️
    </button>

  </div>


  <div id="result">

    <img
      src="./PHOTO-2026-09-19-20-44-07.jpg"
      alt="Ghina"
    >

    <audio controls preload="metadata">
      <source
        src="https://rain4reall.github.io/Princess-ghinah/song.mp3"
        type="audio/mpeg"
      >
      متصفحك لا يدعم تشغيل الصوت.
    </audio>

    <div id="letter"></div>

  </div>


  <script>

    const text = `يمكن ما أقول لك هذا الكلام كثير، لكن أنتِ من الأشخاص الغاليين على قلبي بشكل ما أقدر أوصفه بالكلام. وجودك بحياتي شيء أقدّره كثير، وأحب طيبتك وروحك وكل التفاصيل الجميلة فيك.

أتمنى مهما مرت الأيام وتغيّرت الظروف، تظلين عارفة إن لك مكانة خاصة عندي، وإنك شخص أتمنى له الخير والسعادة من قلبي. 🤍

باختصار… أنا ممتن جدًا إن الحياة عرّفتني عليك، وأتمنى تظلين دايم بخير ومبسوطة، لأنك تستحقين كل شيء جميل.`;

    function enter() {

      const password =
        document.getElementById("password").value;

      if (password === "princess") {

        document.getElementById("login").style.display = "none";

        document.getElementById("result").style.display = "block";

        typeText();

      } else {

        alert("كلمة السر غير صحيحة ❤️");

      }
    }


    function typeText() {

      const letter =
        document.getElementById("letter");

      let i = 0;

      function write() {

        if (i < text.length) {

          letter.textContent += text.charAt(i);

          i++;

          setTimeout(write, 45);

        }

      }

      write();

    }

  </script>

</body>

</html>
